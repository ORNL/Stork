title: Stork
description: Performance-portable coupling of thermal and microstructure simulations
url: "https://ORNL.github.io"
baseurl: "/Stork"
repository: ORNL/Stork

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: stork
permalink: pretty

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - vendor/
  - docs/.bundle/
  - docs/.jekyll-cache/
  - docs/_site/
  - docs/vendor/

defaults:
  - scope:
      path: ""
    values:
      layout: default

search_enabled: true
heading_anchors: true
enable_copy_code_button: true

aux_links:
  "Source":
    - "https://github.com/ORNL/Stork"

aux_links_new_tab: false

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: green
  warning:
    title: Warning
    color: red

footer_content: >-
  Stork is distributed under the BSD 3-Clause License.

sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
